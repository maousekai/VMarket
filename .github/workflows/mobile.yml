name: mobile

on:
  push:
    branches: [dev, release, product]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    branches: [dev, release, product]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npx expo-doctor
      # Bundle JS Android de bat loi import / cau hinh Expo Router ma unit test khong cham toi.
      - run: npx expo export --platform android --output-dir /tmp/expo-export

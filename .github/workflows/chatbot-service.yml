name: chatbot-service
on:
  push:
    branches: [dev, release, product]
    paths: ['services/chatbot-service/**', 'docs/openapi/chatbot-service.yaml', '.github/workflows/chatbot-service.yml']
  pull_request:
    branches: [dev, release, product]
    paths: ['services/chatbot-service/**', 'docs/openapi/chatbot-service.yaml', '.github/workflows/chatbot-service.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatbot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chatbot-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/chatbot-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/unit -v
      - run: python -c "import yaml; yaml.safe_load(open('../../docs/openapi/chatbot-service.yaml', encoding='utf-8'))"
      - run: pip-audit -r requirements.txt
  mongodb:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval=10s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: services/chatbot-service
    env:
      MONGO_HOST: localhost
      MONGO_PORT: '27017'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/integration -v
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vmarket-chatbot:test services/chatbot-service

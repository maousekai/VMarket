name: ai-search-service
on:
  push:
    branches: [dev, release, product]
    paths: ['services/ai-search-service/**', 'docs/openapi/*search*.yaml', '.github/workflows/ai-search-service.yml']
  pull_request:
    branches: [dev, release, product]
    paths: ['services/ai-search-service/**', 'docs/openapi/*search*.yaml', '.github/workflows/ai-search-service.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-search-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-search-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-search-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/unit -v
      - run: pip-audit -r requirements.txt
  elasticsearch:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports: ['9200:9200']
        options: >-
          --memory=1g --health-cmd="curl -fsS http://localhost:9200/_cluster/health"
          --health-interval=10s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: services/ai-search-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/integration -v
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/ai-search-service/Dockerfile -t vmarket-ai-search:test .

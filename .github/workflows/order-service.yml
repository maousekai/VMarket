# =============================================================================
# VMarket - CI cho order-service
# =============================================================================
# Sinh tu template dung chung: docs/templates/ci-service.yml
# Toan bo logic test + build image nam o .github/workflows/service-ci.yml,
# file nay chi khai bao "khi nao chay" va "chay cho service nao".
#
# TRIGGER THEO DUONG DAN (monorepo): chi chay khi co thay doi trong
# services/order-service/ (hoac parent POM / chinh file CI) -> sua service nay
# KHONG lam chay CI cua cac service con lai.
# =============================================================================
name: order-service

on:
  push:
    branches: [dev, release, product]
    paths:
      - "services/order-service/**"
      # Parent POM doi (nang version Spring Boot...) anh huong moi service
      - "services/pom.xml"
      - "services/mvnw"
      # Sua chinh CI thi cung phai chay lai de kiem chung
      - ".github/workflows/order-service.yml"
      - ".github/workflows/service-ci.yml"
  pull_request:
    branches: [dev, release, product]
    paths:
      - "services/order-service/**"
      - "services/pom.xml"
      - "services/mvnw"
      - ".github/workflows/order-service.yml"
      - ".github/workflows/service-ci.yml"
  # Cho phep bam chay tay trong tab Actions
  workflow_dispatch:

# Push lien tiep vao cung nhanh: huy lan chay cu, chi giu lan moi nhat.
concurrency:
  group: ci-order-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: order-service
    # ---- KHI NHOM DA CO REGISTRY thi bo comment khoi duoi ----
    # Mac dinh pipeline CHI BUILD image (khong push) nen chua can secret nao.

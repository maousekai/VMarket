# =============================================================================
# VMarket - CI/CD MAU DUNG CHUNG cho MOI microservice Spring Boot
# =============================================================================
# Day la "reusable workflow": khong tu chay, ma duoc goi lai boi workflow rieng
# cua tung service (.github/workflows/<ten-service>.yml). Nho vay logic
# build/test/dong goi chi viet MOT LAN o day; them service moi chi can them
# mot file goi ~15 dong (mau: docs/templates/ci-service.yml).
#
# LUONG:
#   test  -> chay unit/integration test cua RIENG service do (mvnw -pl <svc> -am)
#   image -> build Docker image cua RIENG service do + smoke test
#            (push len registry: TAT mac dinh, xem input push-image ben duoi)
#
# DOC LAP GIUA CAC SERVICE: moi service co workflow rieng + trigger theo
# duong dan (paths) nen sua auth-service KHONG lam chay CI cua order-service,
# va CI cua service nay hong KHONG chan service khac.
#
# GIA DINH VE DOCKERFILE: workflow nay bam theo Dockerfile mau
# (docs/templates/Dockerfile.springboot):
#   - build context la THU MUC GOC repo (Dockerfile can services/pom.xml)
#   - jar nam o /app/app.jar trong image   -> doi bang input jar-path
#   - co ARG JAVA_VERSION de chon JDK      -> truyen qua input java-version
# Service dung Dockerfile khac chuan (Gradle, ten jar khac) van chay duoc,
# chi can truyen lai jar-path o file goi.
# =============================================================================
name: Service CI (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Ten thu muc service trong services/ (vd: auth-service)"
        required: true
        type: string
      java-version:
        description: >-
          Phien ban JDK. Dung cho CA HAI job: setup-java o job test, va
          build-arg JAVA_VERSION cua Dockerfile o job image -> chi khai bao
          MOT CHO, khong lo nang JDK mot noi quen noi kia.
        required: false
        type: string
        default: "17"
      jar-path:
        description: >-
          Duong dan file jar BEN TRONG image, dung cho smoke test. Mac dinh
          khop Dockerfile mau (copy jar ve /app/app.jar). Service dung
          Dockerfile khac chuan thi truyen lai duong dan that o file goi.
        required: false
        type: string
        default: "/app/app.jar"
      run-tests:
        description: "Chay test hay khong (service moi tao chua co test co the tat)"
        required: false
        type: boolean
        default: true
      push-image:
        description: >-
          Push image len registry. MAC DINH false = chi build de xac nhan
          Dockerfile dung. Khi nhom da chot registry: dat true trong file goi
          va khai bao secret registry-username / registry-password.
        required: false
        type: boolean
        default: false
      registry:
        description: "Registry khi push-image=true (vd: ghcr.io, docker.io)"
        required: false
        type: string
        default: "ghcr.io"
    secrets:
      registry-username:
        required: false
      registry-password:
        required: false

# Chi can quyen doc code; khi bat push len GHCR thi them 'packages: write'
# o file goi (xem docs/templates/ci-service.yml).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST - chay test cua rieng service nay
  # ---------------------------------------------------------------------------
  test:
    name: Test ${{ inputs.service }}
    runs-on: ubuntu-latest
    # Chan job treo: mvnw doi dependency / test khong bao gio ket thuc se bi
    # cat sau 20 phut thay vi chay het timeout mac dinh cua GitHub (6 gio).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          # Cache ~/.m2 theo hash cac file pom -> lan sau khong tai lai dependency
          cache: maven

      # mvnw da duoc commit voi co executable (mode 100755). Buoc nay giu lai
      # cho chac: neu ai do commit lai tu Windows lam mat co, CI van chay duoc.
      - name: Cho phep chay Maven Wrapper
        run: chmod +x ./mvnw
        working-directory: services

      # -pl <service> : CHI build module cua service nay
      # -am           : kem cac module ma no phu thuoc (o day la parent POM)
      # => test doc lap, khong keo theo 10 service con lai.
      - name: Test
        if: ${{ inputs.run-tests }}
        run: ./mvnw -B --no-transfer-progress -pl ${{ inputs.service }} -am test
        working-directory: services

      # Giu lai bao cao khi test hong de mo ra xem chi tiet trong tab Actions.
      - name: Luu bao cao test
        if: ${{ always() && inputs.run-tests }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ inputs.service }}
          path: services/${{ inputs.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. IMAGE - build Docker image cua rieng service nay
  # ---------------------------------------------------------------------------
  image:
    name: Build image ${{ inputs.service }}
    runs-on: ubuntu-latest
    needs: test
    # Rong hon job test: lan chay dau (cache gha con trong) phai tai toan bo
    # dependency Maven BEN TRONG docker build, cham hon chay tren runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Chi dang nhap khi that su push. Mac dinh buoc nay bi bo qua.
      #
      # LUU Y VOI PR TU FORK: khi nhom bat push-image=true sau nay, PR tu fork
      # KHONG duoc cap secrets.registry-* va GITHUB_TOKEN chi co quyen doc
      # -> buoc login/push se hong. Day la hanh vi DUNG (khong cho PR la day
      # image len registry cua nhom); muon fork van xanh thi de push-image=false
      # cho pull_request va chi bat khi push vao nhanh chinh.
      - name: Dang nhap registry
        if: ${{ inputs.push-image }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

      # Tag: <registry>/<owner>/vmarket-<service>:<sha> va :<ten-nhanh>
      # (tinh bang shell de khong phu thuoc them action ngoai).
      #
      # head_ref || ref_name: tren pull_request thi GITHUB_REF_NAME la
      # "<so-pr>/merge" -> tag xau kieu ":123-merge". head_ref cho ra ten nhanh
      # nguon that su. Gia tri di qua bien moi truong (khong noi thang vao
      # script) vi ten nhanh cua PR tu fork la chuoi nguoi ngoai dat duoc.
      - name: Tinh tag image
        id: meta
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ inputs.service }}
          REGISTRY: ${{ inputs.registry }}
          PUSH: ${{ inputs.push-image }}
        run: |
          repo_owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          base="vmarket-${SERVICE}"
          if [ "$PUSH" = "true" ]; then
            base="${REGISTRY}/${repo_owner}/${base}"
          fi
          # Docker tag chi nhan [a-zA-Z0-9._-]; ky tu khac (dau '/' trong
          # "feat/abc", dau tieng Viet...) doi thanh '-'.
          branch=$(echo "$REF_NAME" | sed 's#[^a-zA-Z0-9._-]#-#g' | cut -c1-100)
          {
            echo "tags=${base}:${branch},${base}:${GITHUB_SHA::7}"
            echo "smoke_tag=${base}:${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      # context: . -> thu muc goc repo (Dockerfile can services/pom.xml).
      # load: chi nap image vao docker local khi KHONG push, de con smoke test.
      # cache-from/to gha: tai su dung layer 'deps' giua cac lan chay CI
      # -> build lai chi vai chuc giay thay vi tai lai toan bo dependency.
      # build-args JAVA_VERSION: dong bo JDK cua image voi JDK chay test
      # (Dockerfile mau dung ARG nay cho ca maven image lan JRE runtime).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ inputs.service }}/Dockerfile
          build-args: |
            JAVA_VERSION=${{ inputs.java-version }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ inputs.push-image }}
          load: ${{ !inputs.push-image }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      # Smoke test khong can DB/RabbitMQ: xac nhan image co JRE chay duoc,
      # co file jar (dung duong dan inputs.jar-path) va KHONG chay bang root.
      - name: Smoke test image
        if: ${{ !inputs.push-image }}
        env:
          SMOKE_TAG: ${{ steps.meta.outputs.smoke_tag }}
          JAR_PATH: ${{ inputs.jar-path }}
        run: |
          docker run --rm --entrypoint sh -e "JAR_PATH=$JAR_PATH" "$SMOKE_TAG" -c '
            set -e
            java -version
            test -s "$JAR_PATH" || { echo "THIEU $JAR_PATH trong image"; exit 1; }
            [ "$(id -u)" -ne 0 ] || { echo "Image dang chay bang root"; exit 1; }
            echo "OK: jar=$(du -h "$JAR_PATH" | cut -f1) user=$(id -un)"
          '

      - name: Tom tat
        if: ${{ always() }}
        run: |
          {
            echo "### ${{ inputs.service }}"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.smoke_tag }}\`"
            echo "- JDK: \`${{ inputs.java-version }}\`"
            echo "- Push len registry: \`${{ inputs.push-image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

# Cau hinh chi cho profile 'dev' (local). Khong dung o prod.
# Gia tri gia ro rang de chay 'mvnw spring-boot:run' khong can set bien moi truong.
# Khi chay qua docker compose, cac bien tu .env / anchor common-environment se ghi de.
spring:
  datasource:
    # Local mvnw: PostgreSQL cua docker compose publish ra host o cong 5433
    # (POSTGRES_HOST_PORT trong .env - tranh dung PostgreSQL cai san tren may).
    # Trong container: bien DB_HOST=postgres / DB_PORT=5432 se ghi de default nay.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:vmarket_order}

auth:
  jwt:
    # PHAI trung voi gia tri dev cua auth-service, neu khong token do auth-service
    # phat ra se bi order-service tu choi voi chu ky khong hop le.
    secret: ${AUTH_JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789}

app:
  cart-service:
    # Local mvnw: cart-service chay cong 8085.
    base-url: ${CART_SERVICE_URL:http://localhost:8085}
    # PHAI trung INTERNAL_API_KEY cua cart-service (ben nhan) — cart-service chi tin
    # header X-User-Id khi request kem khoa noi bo nay.
    internal-api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key-change-me-0123456789}

  user-service:
    # Local mvnw: user-service chay cong 8082.
    base-url: ${USER_SERVICE_URL:http://localhost:8082}
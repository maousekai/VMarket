spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vmarket_auth}
    username: ${DB_USERNAME:vmarket}
    password: ${DB_PASSWORD:vmarket}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema do Flyway quan ly. 'validate' de Hibernate chi doi chieu mapping
      # voi schema thuc te, khong tu sua DDL (prod: xem application-prod.yml).
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Cho phep migrate tren DB da co bang (vd vmarket_auth tao san boi container)
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# JWT - doc tu bien moi truong, KHONG hardcode secret that vao repo.
# secret KHONG co gia tri mac dinh o file base -> moi moi truong (ke ca prod)
# thieu AUTH_JWT_SECRET se fail ngay luc khoi dong (placeholder khong resolve +
# @Validated @NotBlank tren AuthJwtProperties). Gia tri gia cho local dev nam o
# application-dev.yml. Secret nay dung chung voi API Gateway khi gateway verify JWT.
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    access-ttl: ${AUTH_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${AUTH_JWT_REFRESH_TTL:30d}

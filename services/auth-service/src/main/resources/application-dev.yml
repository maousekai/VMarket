# Cau hinh chi cho profile 'dev' (local). Khong dung o prod.
# Gia tri gia ro rang de chay 'mvnw spring-boot:run' khong can set bien moi truong.
# Khi chay qua docker compose, cac bien tu .env / anchor common-environment se ghi de.
spring:
  datasource:
    # Local mvnw: PostgreSQL cua docker compose publish ra host o cong 5433
    # (POSTGRES_HOST_PORT trong .env - tranh dung PostgreSQL cai san tren may).
    # Trong container: bien DB_HOST=postgres / DB_PORT=5432 se ghi de default nay.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:vmarket_auth}

app:
  # Tai khoan ADMIN mau cho dev/e2e, tao bang code (DevAdminSeeder) - khong dung
  # Flyway de DB doi profile dev -> prod khong bi ket trong flyway_schema_history.
  # Password de trong -> seeder sinh mat khau ngau nhien va ghi ra log mot lan.
  dev-admin:
    email: ${DEV_ADMIN_EMAIL:admin@vmarket.local}
    username: ${DEV_ADMIN_USERNAME:admin.vmarket}
    password: ${DEV_ADMIN_PASSWORD:}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789}
  # PHAI trung voi gia tri dev cua user-service (application-dev.yml ben do).
  internal:
    api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key-change-me-0123456789}
  refresh-cookie:
    # Local chay HTTP thuan (vite proxy / mvnw spring-boot:run) -> Secure=true se
    # khien trinh duyet khong luu cookie.
    secure: ${AUTH_REFRESH_COOKIE_SECURE:false}

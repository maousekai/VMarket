spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:h2:mem:delivery;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    listener:
      simple:
        auto-startup: false
auth:
  jwt:
    secret: test-only-secret-0123456789-0123456789-0123456789
app:
  outbox-enabled: false
  tracking-listener: false
  delivery:
    internal-api-key: test-only-internal-api-key-0123456789-0123456789
  cors:
    allowed-origins: http://localhost:5173

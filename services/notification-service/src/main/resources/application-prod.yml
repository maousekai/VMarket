# Profile PROD - cau hinh qua bien moi truong
spring:
  mongodb:
    uri: mongodb://${MONGO_HOST}:${MONGO_PORT:27017}/${DB_NAME}?directConnection=true
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  notification:
    order-url: ${ORDER_SERVICE_URL}
    auth-url: ${AUTH_SERVICE_URL}
    shop-url: ${SHOP_SERVICE_URL}
    frontend-url: ${FRONTEND_URL}

logging:
  level:
    root: INFO

# Cau hinh chi cho profile 'dev' (local). Khong dung o prod.
# Gia tri gia ro rang de chay 'mvnw spring-boot:run' khong can set bien moi truong.
spring:
  mongodb:
    # Local mvnw: Mongo cua docker compose publish ra host o cong 27018
    # (MONGO_HOST_PORT - tranh mongod cai san tren may).
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27018}/${DB_NAME:vmarket_notification}?directConnection=true

auth:
  jwt:
    # PHAI trung gia tri dev cua auth-service, neu khong token se bi tu choi.
    secret: ${AUTH_JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789}

app:
  notification:
    # PHAI trung INTERNAL_API_KEY dev cua order-service va auth-service.
    internal-api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key-change-me-0123456789}

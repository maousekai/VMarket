spring:
  application:
    name: review-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vmarket_review}
    username: ${DB_USERNAME:vmarket}
    password: ${DB_PASSWORD:vmarket}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema do Flyway quan ly (db/migration) - Hibernate chi kiem tra khop.
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${SERVER_PORT:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Verify access token do auth-service ky (HS256, dung chung AUTH_JWT_SECRET).
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}

app:
  events:
    # Outbox chi xoa dong khi broker ACK + route thanh cong.
    confirmed-publication: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  review:
    order-url: ${ORDER_SERVICE_URL:http://localhost:8086}
    shop-url: ${SHOP_SERVICE_URL:http://localhost:8083}
    # Origin kho anh (MinIO/CDN) ma URL anh danh gia duoc phep tro toi, phan tach bang dau phay.
    # Khong co mac dinh o day: dev lay o application-dev.yml, prod bat buoc khai (https).
    image-origins: ${REVIEW_IMAGE_ORIGINS}

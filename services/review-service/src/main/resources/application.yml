spring:
  application:
    name: review-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # Anh danh gia toi da 5 MB (ImageKind.REVIEW); du phong overhead multipart.
      max-file-size: 6MB
      max-request-size: 7MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vmarket_review}
    username: ${DB_USERNAME:vmarket}
    password: ${DB_PASSWORD:vmarket}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema do Flyway quan ly (db/migration) - Hibernate chi kiem tra khop.
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${SERVER_PORT:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Verify access token do auth-service ky (HS256, dung chung AUTH_JWT_SECRET).
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}

app:
  events:
    # Outbox chi xoa dong khi broker ACK + route thanh cong.
    confirmed-publication: true
    # Nhan ReturnResolved: don da tra hang / hoan tien thi an danh gia cua don (PBL6-35).
    listen: ${EVENTS_LISTEN:true}
    queue: ${EVENTS_QUEUE:review.events.v1}
    bindings:
      - ReturnResolved
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  review:
    order-url: ${ORDER_SERVICE_URL:http://localhost:8086}
    shop-url: ${SHOP_SERVICE_URL:http://localhost:8083}
    # Origin kho anh (MinIO/CDN) ma URL anh danh gia duoc phep tro toi, phan tach bang dau phay.
    # Khong co mac dinh o day: dev lay o application-dev.yml, prod bat buoc khai (https).
    image-origins: ${REVIEW_IMAGE_ORIGINS}
  # Kho anh MinIO (services/shared-media) cho anh danh gia (PBL6-35). public-origin PHAI nam trong
  # REVIEW_IMAGE_ORIGINS, neu khong URL vua upload se bi tu choi khi gui danh gia.
  # Thieu credential la fail luc khoi dong; gia tri local nam o application-dev.yml.
  media:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-origin: ${MINIO_PUBLIC_ORIGIN:http://localhost:9000}
    bucket: ${MINIO_BUCKET:vmarket-media}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    region: ${MINIO_REGION:us-east-1}

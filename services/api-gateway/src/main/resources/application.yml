spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      server:
        webmvc:
          # Preflight OPTIONS duoc tra loi boi corsPreflightFilter bean trong
          # com.vmarket.gateway.config.CorsConfig (ban WebMVC cua gateway
          # khong ho tro property globalcors nhu ban WebFlux).
          #
          # CORS header cho response THAT do tung service tu them - gateway
          # khong them de tranh bi trung gia tri ("multiple values").
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**
            - id: shop-service
              uri: ${SHOP_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/shops/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/products/**
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/cart/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/orders/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/payments/**
            - id: delivery-service
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/delivery/**
            - id: review-service
              uri: ${REVIEW_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/reviews/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/notifications/**
            - id: ai-search-service
              uri: ${AI_SEARCH_SERVICE_URL:http://localhost:8100}
              predicates:
                - Path=/api/ai/search/**
            - id: recommendation-service
              uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8101}
              predicates:
                - Path=/api/ai/recommendations/**
            - id: chatbot-service
              uri: ${CHATBOT_SERVICE_URL:http://localhost:8102}
              predicates:
                - Path=/api/ai/chat/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# JWT - doc tu bien moi truong, KHONG hardcode secret that vao repo.
# Secret nay PHAI TRUNG voi AUTH_JWT_SECRET cua auth-service (cung khoa HS256)
# de gateway tu verify token auth-service ky. Khong co default o file base:
# muon chay local mvnw thi set AUTH_JWT_SECRET hoac dung application-dev.yml.
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}

# Chinh sach route public / protected (xem GatewaySecurityProperties).
app:
  security:
    # Public moi HTTP method (dang ky/dang nhap, health, swagger, error)
    public-paths:
      - /api/auth/**
      - /actuator/**
      - /v3/api-docs/**
      - /v3/api-docs.yaml
      - /swagger-ui/**
      - /swagger-ui.html
      - /error
    # Chi public voi GET/HEAD (xem hang khong can dang nhap)
    public-get-paths:
      - /api/products/**
      - /api/shops/**
  # Rate limit co ban (fixed-window theo IP). Xem RateLimitProperties.
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    capacity: ${APP_RATE_LIMIT_CAPACITY:200}
    window-seconds: ${APP_RATE_LIMIT_WINDOW_SECONDS:60}

info:
  app:
    name: ${spring.application.name}
    description: VMarket API Gateway - diem vao duy nhat cua he thong
    version: 0.0.1-SNAPSHOT

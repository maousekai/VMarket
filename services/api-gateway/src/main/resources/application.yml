spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**
            - id: shop-service
              uri: ${SHOP_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/shops/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/products/**
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/cart/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/orders/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/payments/**
            - id: delivery-service
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/delivery/**
            - id: review-service
              uri: ${REVIEW_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/reviews/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/notifications/**
            - id: ai-search-service
              uri: ${AI_SEARCH_SERVICE_URL:http://localhost:8100}
              predicates:
                - Path=/api/ai/search/**
            - id: recommendation-service
              uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8101}
              predicates:
                - Path=/api/ai/recommendations/**
            - id: chatbot-service
              uri: ${CHATBOT_SERVICE_URL:http://localhost:8102}
              predicates:
                - Path=/api/ai/chat/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: ${spring.application.name}
    description: VMarket API Gateway - diem vao duy nhat cua he thong
    version: 0.0.1-SNAPSHOT

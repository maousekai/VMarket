spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
auth:
  jwt:
    secret: test-only-secret-0123456789-0123456789-0123456789
app:
  jobs:
    enabled: false
  vnpay:
    hash-secret: test-hash-secret
  events:
    listen: false

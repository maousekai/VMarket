# Cau hinh test - H2 in-memory (MODE PostgreSQL), khong can PostgreSQL / RabbitMQ / Docker.
# Luu y: file nay o test classpath nen GHI DE hoan toan application.yml chinh khi
# chay test -> phai tu chua du cac khoa can thiet.
spring:
  application:
    name: shop-service
  datasource:
    url: jdbc:h2:mem:shop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Test dung schema do Hibernate sinh tu entity. Migration that duoc kiem rieng
      # o FlywayMigrationTest (Flyway bat + ddl-auto=validate).
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173
  internal-api-key: test-internal-key-0123456789
  # Khong goi MinIO trong test hien co; S3Client chi duoc tao (khong ket noi).
  media:
    endpoint: http://minio.test:9000
    public-origin: http://localhost:9000
    bucket: vmarket-media-test
    access-key: test-access-key
    secret-key: test-secret-key
    region: us-east-1
  downstream:
    user-service-url: http://user-service.test:8082
    order-service-url: http://order-service.test:8086
    product-service-url: http://product-service.test:8084
    internal-api-key: test-only-internal-api-key-0123456789-0123456789
    connect-timeout: 1s
    read-timeout: 2s

auth:
  jwt:
    # Du 32 byte cho HS256 (Keys.hmacShaKeyFor tu choi khoa ngan hon).
    secret: test-only-secret-0123456789-0123456789-0123456789

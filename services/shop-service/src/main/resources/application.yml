spring:
  application:
    name: shop-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vmarket_shop}
    username: ${DB_USERNAME:vmarket}
    password: ${DB_PASSWORD:vmarket}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema do Flyway quan ly (db/migration). 'validate' de Hibernate chi doi
      # chieu mapping voi schema thuc te, khong tu sua DDL (giong auth/user-service).
      ddl-auto: validate
    show-sql: true
    # Tat OSIV: moi truy van nam trong @Transactional cua tang service, khong de
    # connection bi giu suot qua trinh serialize response.
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Cho phep migrate tren DB da co bang (vmarket_shop duoc tao san boi container;
    # ban skeleton cu chay ddl-auto=update nen co the da sinh bang rac).
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Su kien ShopApproved/ShopSuspended phat SAU KHI commit, ngay trong request
    # cua Admin. Mac dinh 60s: RabbitMQ khong truy cap duoc (host sai, mang treo)
    # se giu request cua Admin toi 1 phut du trang thai gian hang da luu xong.
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# springdoc dung path mac dinh: /swagger-ui.html va /v3/api-docs
# (whitelist tuong ung o SecurityConfig.PUBLIC_PATHS).

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  # Event bus (shared-events - PBL6-39): shop-service CHI PHAT su kien nen de
  # listen=false (mac dinh) - khong khai bao queue, khong mo ket noi consumer.
  # Exchange mac dinh: vmarket.events (docs/event-bus.md).

# JWT - shop-service chi VERIFY token do auth-service ky (HS256, khoa doi xung nen
# hai ben phai dung CHUNG mot chuoi bi mat). Dung chung prefix `auth.jwt` va chung
# bien AUTH_JWT_SECRET voi auth-service / user-service / gateway.
#
# secret KHONG co gia tri mac dinh o file nen -> moi moi truong (ke ca prod) thieu
# AUTH_JWT_SECRET se fail ngay luc khoi dong. Gia tri gia cho local dev nam o
# application-dev.yml.
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}

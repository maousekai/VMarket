spring:
  application:
    name: product-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${DB_NAME:vmarket_product}?replicaSet=${MONGO_REPLICA_SET:rs0}&directConnection=${MONGO_DIRECT_CONNECTION:true}
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  internal-api-key: ${INTERNAL_API_KEY:dev-only-product-internal-key}
  events:
    listen: ${EVENTS_LISTEN:true}
    queue: ${EVENTS_QUEUE:product.events}
    bindings:
      - OrderPlaced
      - OrderConfirmed
      - OrderCancelled
      - PaymentSucceeded
      - ShopApproved
      - ShopSuspended
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

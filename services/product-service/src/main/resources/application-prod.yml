# Profile PROD - cau hinh qua bien moi truong
spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST}:${MONGO_PORT:27017}/${DB_NAME}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
# Profile PROD - cau hinh qua bien moi truong
spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST}:${MONGO_PORT:27017}/${DB_NAME}?replicaSet=${MONGO_REPLICA_SET:rs0}&directConnection=${MONGO_DIRECT_CONNECTION:false}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  internal-api-key: ${INTERNAL_API_KEY}

logging:
  level:
    root: INFO

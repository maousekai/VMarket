spring:
  application:
    name: product-service
  mongodb:
    uri: mongodb://localhost:27017/vmarket_product_test
  data:
    mongodb:
      auto-index-creation: false

auth:
  jwt:
    # Du 32 byte cho HS256 (Keys.hmacShaKeyFor tu choi khoa ngan hon).
    secret: test-only-secret-0123456789-0123456789-0123456789

app:
  internal-api-key: test-internal-key
  media:
    endpoint: http://minio.test:9000
    public-origin: http://localhost:9000
    bucket: vmarket-media-test
    access-key: test-access-key
    secret-key: test-secret-key
    region: us-east-1
  events:
    listen: false
  outbox:
    enabled: false
  catalog-migration:
    enabled: false

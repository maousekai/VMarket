# Cau hinh test - H2 in-memory (MODE PostgreSQL), khong can PostgreSQL / Docker.
# Luu y: file nay o test classpath nen GHI DE hoan toan application.yml chinh khi
# chay test -> phai tu chua du cac khoa can thiet.
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:user;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Test dung schema do Hibernate sinh tu entity (khong chay migration Postgres).
      # HE QUA: partial unique index uq_addresses_one_default_per_user KHONG ton tai
      # trong test vi H2 khong ho tro partial index. Bat bien "toi da mot dia chi
      # mac dinh" duoc test o tang service, con tang CSDL chi co tren PostgreSQL that.
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173

auth:
  jwt:
    # Du 32 byte cho HS256 (Keys.hmacShaKeyFor tu choi khoa ngan hon).
    secret: test-only-secret-0123456789-0123456789-0123456789

name: vmarket

# TỐI ƯU TÀI NGUYÊN:
# - Chỉ 4 hạ tầng nhẹ chạy mặc định (~1.5GB RAM). Elasticsearch nặng (~1GB) đặt
#   profile "search" - chỉ bật khi làm AI Search: docker compose --profile search up -d
# - Mỗi container có mem_limit để không chiếm hết RAM máy.
# - Chạy đúng những gì cần: docker compose up -d postgres redis  (chỉ 2 service này)

services:
  # PostgreSQL - CSDL quan hệ cho: auth, user, shop, order, payment, delivery, review, recommendation
  postgres:
    image: postgres:17-alpine
    container_name: vmarket-postgres
    environment:
      POSTGRES_USER: vmarket
      POSTGRES_PASSWORD: vmarket
      POSTGRES_DB: vmarket_auth
    ports:
      - "5432:5432"
    volumes:
      - vmarket-pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - vmarket-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmarket -d vmarket_auth"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MongoDB - CSDL cho: product, notification, chatbot
  mongo:
    image: mongo:8.0
    container_name: vmarket-mongo
    ports:
      - "27017:27017"
    volumes:
      - vmarket-mongo-data:/data/db
    networks:
      - vmarket-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Redis - cho: cart, delivery (vị trí shipper), recommendation (cache)
  redis:
    image: redis:7.4-alpine
    container_name: vmarket-redis
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - vmarket-redis-data:/data
    networks:
      - vmarket-network
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # RabbitMQ - Event Bus giữa các service (management UI: http://localhost:15672, guest/guest)
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: vmarket-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - vmarket-rabbit-data:/var/lib/rabbitmq
    networks:
      - vmarket-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Elasticsearch - CHỈ cho AI Search (nặng ~1GB). Bật khi cần:
  #   docker compose --profile search up -d
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: vmarket-elasticsearch
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - vmarket-es-data:/usr/share/elasticsearch/data
    networks:
      - vmarket-network
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12

  # =====================================================================
  # CÁC SERVICE ỨNG DỤNG - mỗi service backend chỉ cần THÊM 1 BLOCK dưới đây.
  # Service discovery: trong cùng network "vmarket-network", gọi nhau bằng
  # TÊN SERVICE (vd: http://auth-service:8081) - không cần IP.
  # Mẫu (bỏ comment khi service đó được code ở sprint sau):
  #
  # auth-service:
  #   build: ./services/auth-service
  #   container_name: vmarket-auth
  #   networks:
  #     - vmarket-network
  #   mem_limit: 384m
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: vmarket_auth
  #     RABBITMQ_HOST: rabbitmq
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   ports:
  #     - "8081:8081"
  #
  # api-gateway:
  #   build: ./services/api-gateway
  #   container_name: vmarket-gateway
  #   networks:
  #     - vmarket-network
  #   mem_limit: 384m
  #   environment:
  #     AUTH_SERVICE_URL: http://auth-service:8081
  #     USER_SERVICE_URL: http://user-service:8082
  #   ports:
  #     - "8080:8080"

# Network chung cho toàn bộ hệ thống (service discovery qua tên service).
networks:
  vmarket-network:
    name: vmarket-network
    driver: bridge

volumes:
  vmarket-pg-data:
  vmarket-mongo-data:
  vmarket-redis-data:
  vmarket-rabbit-data:
  vmarket-es-data:

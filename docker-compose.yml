services:
  # PostgreSQL dùng chung cho môi trường dev
  db:
    image: postgres:16-alpine
    container_name: vmarket-db
    environment:
      POSTGRES_DB: vmarket
      POSTGRES_USER: vmarket
      POSTGRES_PASSWORD: vmarket
    ports:
      - "5432:5432"
    volumes:
      - vmarket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmarket -d vmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bật lên khi làm ticket "Dockerize BE" (PBL6-2):
  # backend:
  #   build: ./backend
  #   container_name: vmarket-backend
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     SPRING_PROFILES_ACTIVE: dev
  #     DB_HOST: db
  #   ports:
  #     - "8080:8080"

  # Bật lên khi làm ticket "Dockerize FE" (PBL6-3):
  # frontend:
  #   build: ./frontend
  #   container_name: vmarket-frontend
  #   depends_on:
  #     - backend
  #   ports:
  #     - "5173:5173"

volumes:
  vmarket-db-data:

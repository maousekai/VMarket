# ============================================================
# VMarket - Docker Compose (HA TANG CHUNG + API GATEWAY + FRONTEND)
# ============================================================
# - Ha tang: PostgreSQL, MongoDB, Redis, RabbitMQ (+ Elasticsearch
#   profile "search").
# - 2 lop "mat" de FE ket noi duoc BE ngay khi `docker compose up -d`:
#     + api-gateway (localhost:8080): browser goi vao day. Gateway trong
#       container tro cac URL service den host.docker.internal (cac
#       business service chay local qua scripts/vmarket - mvnw).
#       Doi host dich vu bang bien BACKEND_SERVICES_HOST trong .env
#       (vd container hoa service thi dat la ten service trong network).
#     + frontend (localhost:5173): SPA nginx; bundle duoc bake
#       VITE_API_BASE_URL (bien .env) de browser goi truc tiep Gateway.
# - Business service van them block rieng khi can, DUNG CHUNG config qua
#   anchor `*common-environment` (xem mau block ben duoi).
# - Tat ca service cung nam trong network chung "vmarket-network" (PBL6-9),
#   goi nhau bang ten service (vd: http://auth-service:8081).
# - Moi gia tri cau hinh lay tu file .env (copy tu .env.example).
#
# TỐI ƯU TÀI NGUYÊN:
# - Ha tang nhe mac dinh ~1.5GB RAM. Elasticsearch nang (~1GB) dat
#   profile "search" - chi bat khi lam AI Search:
#     docker compose --profile search up -d
# - Moi container co mem_limit de khong chiem het RAM may.

name: ${COMPOSE_PROJECT_NAME:-vmarket}

# ------------------------------------------------------------
# BLOCK DUNG CHUNG - env ket noi ha tang cho moi business service.
# Service chi can merge bang merge-key cua YAML:
#   environment:
#     <<: *common-environment
#     DB_NAME: vmarket_<ten_service>   # override gia tri rieng (neu co)
# ------------------------------------------------------------
x-common-environment: &common-environment
  # PostgreSQL
  DB_HOST: ${POSTGRES_HOST:-postgres}
  DB_PORT: ${POSTGRES_PORT:-5432}
  DB_USERNAME: ${POSTGRES_USER:-vmarket}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-vmarket}
  # MongoDB
  MONGO_HOST: ${MONGO_HOST:-mongo}
  MONGO_PORT: ${MONGO_PORT:-27017}
  # Redis
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  # RabbitMQ
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

# ------------------------------------------------------------
# MAU BLOCK BUSINESS SERVICE (bo comment + dien ten khi can them service)
# ------------------------------------------------------------
#  <service-name>:
#    build:
#      context: .
#      dockerfile: services/<service-name>/Dockerfile
#    container_name: vmarket-<ten>
#    mem_limit: 512m
#    environment:
#      <<: *common-environment
#      DB_NAME: vmarket_<ten>      # service dung PostgreSQL (Mongo thi DB_NAME cung dung)
#    depends_on:
#      postgres:
#        condition: service_healthy
#      rabbitmq:
#        condition: service_healthy

# ------------------------------------------------------------
# BLOCK DUNG CHUNG 2 - URL cac business service cho API Gateway.
# Business service chay local (mvnw) nen dung host.docker.internal;
# sau nay container hoa thi doi BACKEND_SERVICES_HOST trong .env
# thanh ten service trong network (vd: auth-service).
# ------------------------------------------------------------
x-service-urls: &service-urls
  AUTH_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8081
  USER_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8082
  SHOP_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8083
  PRODUCT_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8084
  CART_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8085
  ORDER_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8086
  PAYMENT_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8087
  DELIVERY_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8088
  REVIEW_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8089
  NOTIFICATION_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8090
  AI_SEARCH_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8100
  RECOMMENDATION_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8101
  CHATBOT_SERVICE_URL: http://${BACKEND_SERVICES_HOST:-host.docker.internal}:8102

services:
  # PostgreSQL - CSDL quan he cho: auth, user, shop, order, payment, delivery, review
  postgres:
    image: postgres:17-alpine
    container_name: vmarket-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vmarket}
      POSTGRES_DB: ${POSTGRES_DB:-vmarket_auth}
    ports:
      # Port host: POSTGRES_HOST_PORT (5433 - tranh xung dot voi PostgreSQL
      # cai local tren may). Port trong container luon la 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - vmarket-pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - vmarket-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vmarket} -d ${POSTGRES_DB:-vmarket_auth}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MongoDB - CSDL cho: product, notification, chatbot
  mongo:
    image: mongo:8.0
    container_name: vmarket-mongo
    ports:
      # Port host: MONGO_HOST_PORT (27018 - tranh xung dot voi mongod cai
      # local tren may). Port trong container luon la 27017.
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - vmarket-mongo-data:/data/db
    networks:
      - vmarket-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Redis - cho: cart, delivery (vi tri shipper), recommendation (cache)
  redis:
    image: redis:7.4-alpine
    container_name: vmarket-redis
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - vmarket-redis-data:/data
    networks:
      - vmarket-network
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # RabbitMQ - Event Bus giua cac service (UI: http://localhost:15672)
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: vmarket-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - vmarket-rabbit-data:/var/lib/rabbitmq
    networks:
      - vmarket-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Elasticsearch - CHI cho AI Search (nang ~1GB). Bat khi can:
  #   docker compose --profile search up -d
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: vmarket-elasticsearch
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - vmarket-es-data:/usr/share/elasticsearch/data
    networks:
      - vmarket-network
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12

  # Auth Service - xac thuc / JWT (container hoa: khong can chay mvnw nua).
  # Ket noi postgres + rabbitmq bang ten service trong network (port noi bo).
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: vmarket-auth-service
    networks:
      - vmarket-network
    mem_limit: 512m
    environment:
      <<: *common-environment
      DB_NAME: vmarket_auth
      # Origin FE duoc phep (trung voi CORS_ALLOWED_ORIGINS trong .env)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
      # JWT (PBL6-41) - PROD phai override AUTH_JWT_SECRET bang chuoi ngau nhien manh.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-insecure-secret-change-me-please-0123456789}
      AUTH_JWT_ACCESS_TTL: ${AUTH_JWT_ACCESS_TTL:-15m}
      AUTH_JWT_REFRESH_TTL: ${AUTH_JWT_REFRESH_TTL:-30d}
    ports:
      # Publish de co the goi truc tiep tu may host khi debug (khong bat buoc)
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://localhost:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # API Gateway - diem vao duy nhat cua he thong (browser goi vao localhost:8080).
  # Gateway goi cac business service chay tren may host qua host.docker.internal;
  # auth-service da container hoa nen goi truc tiep qua ten service trong network.
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: vmarket-gateway
    networks:
      - vmarket-network
    mem_limit: 384m
    environment:
      <<: *service-urls
      # Override rieng cho auth-service (chay trong network, khong qua host)
      AUTH_SERVICE_URL: http://auth-service:8081
      # Origin FE duoc phep goi API qua gateway (phai trung voi FRONTEND_PORT).
      # Spring relaxed binding: APP_CORS_ALLOWED_ORIGINS -> app.cors.allowed-origins
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    # host-gateway: giu host.docker.internal hoat dong ca tren Linux
    # (Docker Desktop Windows/Mac da co san, dong nay vo hai).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend - React + Vite (SPA tinh phuc vu bang nginx; mo: http://localhost:5173).
  # Browser tren may host goi truc tiep Gateway qua VITE_API_BASE_URL
  # (bake vao bundle luc build); frontend van nam trong vmarket-network
  # de dong nhat voi cac service khac (khong bat buoc cho luong chinh).
  frontend:
    build:
      context: ./frontend
      args:
        # RONG = bundle goi `/api/...` cung origin, nginx trong container FE
        # reverse proxy sang api-gateway => khong CORS. Chi dat URL tuyet doi
        # khi muon browser goi thang gateway (luc do CORS quay lai).
        # Vite bake gia tri nay vao bundle LUC BUILD -> doi thi phai build lai:
        #   docker compose up -d --build frontend
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: vmarket-frontend
    networks:
      - vmarket-network
    mem_limit: 64m
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    # Chi de xep thu tu khoi dong. nginx dung resolver dong nen FE van len duoc
    # khi gateway chua san sang (request /api/ tra 502 cho toi khi gateway UP),
    # khong ket container FE vao vong doi cua gateway.
    depends_on:
      - api-gateway
    # Khong khai healthcheck o day: frontend/Dockerfile da co HEALTHCHECK san
    # trong image (khai lai = 2 nguon cho cung mot thu).

# Network chung cho tat ca service (PBL6-9). `name:` dinh danh de khong phu
# thuoc ten project compose; cac service goi nhau bang ten service trong network.
networks:
  vmarket-network:
    name: vmarket-network
    driver: bridge

volumes:
  vmarket-pg-data:
  vmarket-mongo-data:
  vmarket-redis-data:
  vmarket-rabbit-data:
  vmarket-es-data:

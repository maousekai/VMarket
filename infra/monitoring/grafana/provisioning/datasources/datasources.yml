# Datasource nap san cho Grafana (PBL6-40). uid co dinh vi dashboard JSON
# trong ../../dashboards tham chieu truc tiep toi "prometheus" va "loki".
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

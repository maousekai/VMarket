# ============================================================
# VMarket - Promtail (PBL6-40)
# ============================================================
# Doc log stdout cua MOI container thuoc compose project VMarket qua Docker
# API (mount /var/run/docker.sock) roi day sang Loki. Khong can sua gi khi
# them service moi vao docker-compose.yml - container moi tu duoc phat hien.
#
# Nhan gan cho moi dong log:
#   service   : ten service trong docker-compose.yml (auth-service, postgres...)
#   container : ten container (VMarket-auth-service...)
#   level     : INFO/WARN/ERROR - chi co voi log JSON cua service Spring Boot
#
# ${COMPOSE_PROJECT_NAME} duoc thay luc khoi dong (-config.expand-env=true).
# ============================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=${COMPOSE_PROJECT_NAME}"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      # Service Spring Boot log JSON (logstash). Dong khong phai JSON (postgres,
      # rabbitmq...) bo qua stage nay va van duoc day di nguyen van.
      - json:
          expressions:
            level: level
      - labels:
          level:

# Optional operator-selected LLM. Pin OLLAMA_IMAGE to a reviewed digest before use.
services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set a reviewed official ollama/ollama image digest}
    profiles: [ollama]
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["vmarket-ollama-models:/root/.ollama"]
    networks: [vmarket-network]
    mem_limit: 1536m
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "60s"
      OLLAMA_NO_CLOUD: "true"
volumes:
  vmarket-ollama-models:

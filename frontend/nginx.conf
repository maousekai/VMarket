# Cau hinh nginx cho frontend (React + Vite build tinh, SPA routing voi react-router)
# Container chay non-root (USER nginx) nen pid/temp de o /tmp, log ghi ra stdout/stderr

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS noi bo cua Docker cho user-defined network (vmarket-network).
    # BAT BUOC phai khai vi upstream duoi kia dung BIEN ($api_gateway): nginx chi
    # chap nhan resolve ten mien luc chay khi co resolver.
    #
    # Vi sao khong viet thang `proxy_pass http://api-gateway:8080`? Vi khi do
    # nginx resolve DNS MOT LAN luc doc config:
    #   - gateway chua ton tai  -> nginx CHET NGAY luc khoi dong (host not found)
    #   - gateway restart doi IP -> nginx giu IP cu, proxy hong den khi restart tay
    # Dung bien + resolver thi nginx luon len duoc, gateway chua co thi tra 502,
    # va IP moi duoc nhan lai sau toi da 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Cho WebSocket / SSE ve sau (notification, chatbot): giu nguyen header
    # Upgrade khi client yeu cau, dong ket noi khi khong.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Temp path vao /tmp de nginx chay duoc voi user khong phai root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Dich den cua reverse proxy = ten service trong docker-compose.
        # Doi ten/port gateway thi sua DUNG dong nay.
        set $api_gateway "http://api-gateway:8080";

        # ---------------------------------------------------------------------
        # REVERSE PROXY -> API GATEWAY
        # ---------------------------------------------------------------------
        # Trinh duyet goi /api/... ngay tren origin cua chinh trang FE
        # (http://localhost:5173/api/auth/health), nginx chuyen tiep sang gateway.
        # => CUNG ORIGIN, nen KHONG he phat sinh CORS: khong preflight OPTIONS,
        #    khong can Access-Control-Allow-Origin, khong lo sai origin khi doi port.
        # Gateway giu nguyen prefix /api (routes cua no la Path=/api/auth/**...)
        # nen $request_uri duoc chuyen tiep NGUYEN VEN, khong cat/ghep gi.
        location /api/ {
            proxy_pass $api_gateway$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # WebSocket / SSE cho cac tinh nang thoi gian thuc sau nay
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # connect ngan de bao loi som khi gateway chua len; read dai hon cho
            # cac request cham (AI search, chatbot).
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Khi lam chatbot streaming (SSE) thi them: proxy_buffering off;
        }

        # LUU Y ve `add_header`: nginx KHONG cong don header giua cac cap do —
        # location nao co add_header rieng se BO HET add_header ke thua tu server.
        # Neu sau nay them header bao mat o muc server, phai lap lai trong tung
        # location duoi day, neu khong chung se am tham bien mat.

        # JS/CSS do Vite build co hash trong ten file => cache dai
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html khong cache de phien ban moi duoc nap ngay
        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # SPA fallback: route nao khong trung file tinh deu tra index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

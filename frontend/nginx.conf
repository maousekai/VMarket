# Cau hinh nginx cho frontend (React + Vite build tinh, SPA routing voi react-router)
# Container chay non-root (USER nginx) nen pid/temp de o /tmp, log ghi ra stdout/stderr

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Temp path vao /tmp de nginx chay duoc voi user khong phai root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # JS/CSS do Vite build co hash trong ten file => cache dai
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html khong cache de phien ban moi duoc nap ngay
        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # SPA fallback: route nao khong trung file tinh deu tra index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

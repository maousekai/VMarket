# Cau hinh nginx cho frontend (React + Vite build tinh)
# - Muc http o day la phan TINH; server block nam o default.conf.template
#   (co bien moi truong ${API_GATEWAY_URL} nen phai qua envsubst luc khoi dong).
# - Container chay non-root (USER nginx) nen pid/temp de o /tmp, log ra stdout/stderr.

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Temp path vao /tmp de nginx chay duoc voi user khong phai root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Kich thuoc body cho upload qua proxy (anh san pham...); 0 = khong gioi han
    # thi de nghen RAM, 20m du cho anh/tai lieu.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Chuyen tiep dung header Connection khi client nang cap len WebSocket
    # (SSE/WebSocket qua Gateway van chay); request thuong -> Connection rong
    # de giu keepalive voi upstream.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Server block sinh tu /etc/nginx/templates/default.conf.template
    # (entrypoint cua image nginx chay envsubst luc container khoi dong).
    include /etc/nginx/conf.d/*.conf;
}

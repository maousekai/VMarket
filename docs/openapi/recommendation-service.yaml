openapi: 3.1.0
info:
  title: VMarket Recommendation Service
  version: 1.0.0
  description: Content similarity and guest/cold-start fallback, plus authenticated hybrid ranking from consumed behavior. Behavior producers and periodic training are outside this implementation.
servers: [{url: 'http://localhost:8080'}]
paths:
  /api/ai/recommendations/for-you:
    get:
      description: Optional bearer auth with 30 seconds of clock skew. Guests and users without usable history receive popular/category fallback. Other users receive normalized content/collaborative ranking; purchased products are excluded. Invalid supplied tokens return 401; clients should refresh or omit them for guest access. category_id matches categoryPath including ancestors. Unknown query parameters are ignored; identity overrides and repeated supported parameters return 400.
      security: [{Bearer: []}, {}]
      parameters:
        - {name: category_id, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Eligible products, personalized for verified users with usable history, otherwise popular fallback. Only the requesting user's ID and public product fields are returned.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, items]
                properties:
                  user_id: {type: string, description: Verified JWT subject or empty string for guest}
                  items: {$ref: '#/components/schemas/Items'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/ai/recommendations/similar/{product_id}:
    get:
      description: Category-path/text similarity with price proximity as tie-breaker. A visible, non-deleted seed may be out of stock; only in-stock alternatives are returned. Missing, hidden or deleted seeds return 404. Unknown query parameters are ignored; category_id is not supported here.
      security: [{Bearer: []}, {}]
      parameters:
        - {name: product_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Unique eligible products excluding the seed.
          content:
            application/json:
              schema:
                type: object
                required: [product_id, items]
                properties:
                  product_id: {type: string}
                  items: {$ref: '#/components/schemas/Items'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/ai/recommendations/health:
    get:
      responses:
        '200':
          description: PostgreSQL readiness is checked on every request using SELECT 1. Catalog statistics are cached for 30 seconds; Redis/RabbitMQ may be degraded. DLQ count is sampled every 30 seconds; last refresh does not certify complete synchronization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: Required PostgreSQL dependency is unavailable; status is DOWN.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
components:
  securitySchemes:
    Bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 12}}
  schemas:
    Health:
      type: object
      required: [status, service, postgres, redis, rabbitmq, rabbitmqDeadLetters, catalog]
      properties:
        status: {type: string, enum: [UP, DOWN]}
        service: {type: string, const: recommendation-service}
        postgres: {type: string, enum: [ready, unavailable]}
        redis: {type: string, enum: [ready, unavailable]}
        rabbitmq: {type: string, enum: [ready, unavailable]}
        rabbitmqDeadLetters: {type: [integer, 'null'], minimum: 0, description: Null while the consumer is disconnected or disabled}
        catalog:
          type: object
          required: [items, lastRefreshAt]
          properties:
            items: {type: [integer, 'null'], minimum: 0}
            lastRefreshAt: {type: [string, 'null'], format: date-time}
    Items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Product'}}
    Product:
      type: object
      additionalProperties: false
      required: [id, shopId, name, description, imageUrls, categoryId, currency, minPrice, maxPrice, ratingAverage, ratingCount, soldCount, availableStock]
      properties:
        id: {type: string}
        shopId: {type: string}
        name: {type: string}
        description: {type: string}
        imageUrls: {type: array, items: {type: string}, maxItems: 9}
        categoryId: {type: [string, 'null']}
        currency: {type: string, const: VND}
        minPrice: {type: [integer, 'null'], minimum: 0}
        maxPrice: {type: [integer, 'null'], minimum: 0}
        ratingAverage: {type: number, minimum: 0, maximum: 5}
        ratingCount: {type: integer, minimum: 0}
        soldCount: {type: integer, minimum: 0}
        availableStock: {type: integer, minimum: 1}
    Error:
      type: object
      required: [timestamp, status, error, path]
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        path: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [INVALID_QUERY, UNAUTHORIZED, PRODUCT_NOT_FOUND, RECOMMENDATION_UNAVAILABLE, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, PAYLOAD_TOO_LARGE, TOO_MANY_REQUESTS, HTTP_ERROR]}
            message: {type: string}
  responses:
    Error:
      description: Stable validation/auth/not-found/dependency error. Request validation returns 400 INVALID_QUERY; other framework errors map by HTTP status.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

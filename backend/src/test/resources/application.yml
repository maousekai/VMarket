# Cau hinh test - H2 in-memory (MODE PostgreSQL), khong can PostgreSQL that
spring:
  application:
    name: vmarket-backend
  datasource:
    url: jdbc:h2:mem:vmarket;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
